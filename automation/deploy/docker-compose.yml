services:
  n8n:
    image: docker.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      # Lokalno pokretanje (Docker Desktop) — n8n dostupan samo na
      # 127.0.0.1, nikad izvan tvog racunala.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Zagreb
      # Napomena: stare N8N_BASIC_AUTH_* varijable su no-op u modernom
      # n8n-u (v2.x) — ugrađeni sustav prijave (owner racun) preuzima tu
      # ulogu, kreira se izravno u sucelju kod prvog otvaranja localhost:5678.
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - automation

  automation:
    build:
      context: ../..
      dockerfile: automation/deploy/Dockerfile
    restart: unless-stopped
    ports:
      # Samo radi lokalnog testiranja (curl/Postman) bez n8n-a — n8n
      # sam interno koristi http://automation:8000, ne ovaj host port.
      - "127.0.0.1:8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SCRAPER_USER_ID=${SCRAPER_USER_ID}
    volumes:
      # CSV izvoz (?export_csv na /run) — bez ovoga pipeline.py pise u
      # kontejnerov filesystem, nedohvatljivo s hosta. Bind-mount na ISTU
      # automation/exports/ mapu koju koristi i lokalni CLI (vidi
      # pipeline.py EXPORTS_DIR), pa je izvoz preko n8n-a i preko CLI-ja
      # dostupan na istom mjestu na disku bez obzira odakle je pokrenut.
      - ../exports:/repo/automation/exports

volumes:
  n8n_data:
